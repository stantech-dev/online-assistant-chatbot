<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AU Smart Assistant</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script src="/static/app.js?v=2" defer></script>
</head>
<body>
  <div class="chat">
    <header>
      <div>
        <h1>AU Smart Assistant</h1>
        <p>Ask about Alupe University</p>
      </div>
      <button id="refresh" type="button" aria-label="Start a new chat" title="Start a new chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </header>

    <div id="messages"></div>
    <div class="chips" id="chips"></div>

    <form id="form">
      <input id="input" type="text" maxlength="500" placeholder="Type your question..." autocomplete="off">
      <button id="send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </form>
  </div>
</body>
</html>
